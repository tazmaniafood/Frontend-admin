<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="../IMG/favicon.png?v=51" type="image/png">
<title>Todos los pedidos · Admin Pa'l Filo</title>
<meta name="theme-color" content="#0D0919">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Styles/palfilo.css?v=51">
<link rel="stylesheet" href="../Styles/panel.css?v=51">
<script src="../JS/auth.js?v=51"></script>
</head>
<body>
<header class="carpa">
  <div class="carpa__fila">
    <a class="sello" href="#" role="button" aria-haspopup="menu" aria-expanded="false" aria-label="Menú de la cuenta" title="Cuenta"><img src="../IMG/Logo-palfilo-sello.png?v=51" alt="" width="56" height="56"></a>
    <nav class="menu" aria-label="Secciones del panel"><a href="estadisticas.html">Estadísticas</a><a href="cocina.html">Cocina</a><a href="entregas.html">Entregas</a><a href="todos-pedidos.html" aria-current="page">Todos los pedidos</a></nav>
  </div>
</header>
<main>
  <div class="pagehead">
    <h1 class="letrero" style="--n: var(--cian);">Todos los pedidos</h1><p>Cliente, orden, pago, estado y foto de entrega de cada pedido.</p>
  </div>
  <section class="caja tabla-wrap">
    <div class="herramientas">
      <label class="buscar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="buscar" type="search" placeholder="Buscar por número, nombre o celular" aria-label="Buscar pedidos" autocomplete="off"></label>
      <div class="chips" role="group" aria-label="Filtrar por estado">
        <button class="f f-activos on" type="button" data-f="activos" aria-pressed="true">Activos <b></b></button>
        <button class="f f-nuevo" type="button" data-f="nuevo" aria-pressed="false">Nuevos <b></b></button>
        <button class="f f-reparto" type="button" data-f="listo" aria-pressed="false">Listos <b></b></button>
        <button class="f f-todos" type="button" data-f="todos" aria-pressed="false">Todos <b></b></button>
      </div>
      <span class="total-ped"><b id="n" aria-live="polite"></b> pedidos</span>
    </div>
    <table class="pedidos">
      <thead><tr>
        <th scope="col">Pedido</th><th scope="col">Cliente</th><th scope="col">Orden</th>
        <th scope="col">Pago</th><th scope="col">Estado</th><th scope="col" class="c-foto">Foto</th>
      </tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </section>
</main>
<footer class="pie pie--panel">
  <div class="envoltura">
    <img class="pie__logo" src="../IMG/Marca/logo-horizontal.png?v=51" alt="Pa'l Filo, Colombian street food" width="640" height="247" loading="lazy">
    <p class="pie__lema">Panel de administración</p>
    <p class="pie__meta">Pa'l Filo · Colombian street food · San José, California</p>
  </div>
</footer>
<div class="toast" id="toast" role="status"></div>
<dialog class="visor" id="visor" aria-labelledby="visor-tit">
  <div class="visor-top"><h2 id="visor-tit">Foto de entrega</h2><button class="visor-x" type="button" data-cerrar aria-label="Cerrar">✕</button></div>
  <img id="visor-img" alt="">
  <p class="visor-pie" id="visor-pie"></p>
</dialog>
<script src="../JS/data.js?v=51"></script>
<script src="../JS/todos-pedidos.js?v=51"></script>
</body>
</html>
