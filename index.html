<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="IMG/favicon.png?v=47" type="image/png">
<title>Iniciar sesión · Admin Pa'l Filo</title>
<meta name="theme-color" content="#0D0919">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Styles/palfilo.css?v=47">
<link rel="stylesheet" href="Styles/panel.css?v=47">
</head>
<body>
<main class="login-main">
  <section class="panel login">
    <span class="logo"><img src="IMG/Logo-palfilo-icono.png?v=47" alt="Pa'l Filo"></span>
    <h1 class="letrero" style="--n: var(--mango);">Panel Pa'l Filo</h1>
    <p class="sub">Inicia sesión para entrar al panel de administración.</p>
    <form id="login" novalidate>
      <label>Usuario
        <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label>Contraseña
        <span class="clave">
          <input id="clave" name="clave" type="password" autocomplete="current-password" required>
          <button class="ver" id="ver" type="button" aria-pressed="false" aria-label="Mostrar u ocultar la contraseña">Ver</button>
        </span>
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn go" type="submit">Entrar</button>
    </form>
  </section>
</main>
<script src="JS/auth.js?v=47"></script>
<script src="JS/login.js?v=47"></script>
</body>
</html>
