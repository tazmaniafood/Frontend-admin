<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="IMG/Logo-taz.png?v=7" type="image/png">
<title>Iniciar sesión · Admin TAZ</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Styles/base.css?v=7">
<link rel="stylesheet" href="Styles/login.css?v=7">
</head>
<body>
<main class="login-main">
  <section class="panel login">
    <span class="logo"><img src="IMG/Logo-taz-trans.png?v=7" alt="TAZ Fast Food"></span>
    <h1>Panel TAZ</h1>
    <p class="sub">Inicia sesión para entrar al panel de administración.</p>
    <form id="login" novalidate>
      <label>Usuario
        <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label>Contraseña
        <span class="clave">
          <input id="clave" name="clave" type="password" autocomplete="current-password" required>
          <button class="ver" id="ver" type="button" aria-pressed="false" aria-label="Mostrar u ocultar la contraseña">Ver</button>
        </span>
      </label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn go" type="submit">Entrar</button>
    </form>
  </section>
</main>
<script src="JS/auth.js?v=7"></script>
<script src="JS/login.js?v=7"></script>
</body>
</html>
